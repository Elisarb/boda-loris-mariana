<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loris y Mariana · Invitación</title><link href="https://fonts.googleapis.com/css2?family=Mea+Culpa&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="estilo.css"><link rel="prefetch" href="invitacion.html"></head>
<body class="cover-page">
<main class="envelope" aria-label="Sobre de la invitación">

<a class="opening" href="invitacion.html?musica=1"><span class="seal" aria-hidden="true">L<span class="monogram-amp">&amp;</span>M</span><span class="caption">Abrir invitación</span></a>
</main>
<script>
const opening = document.querySelector('.opening');
const guestLink = new URL(opening.href);
for (const key of ['nombre', 'plazas']) {
  const value = new URLSearchParams(location.search).get(key);
  if (value) guestLink.searchParams.set(key, value);
}
opening.href = guestLink.href;
opening.addEventListener('click', event => {
  if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey ||
      matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  event.preventDefault();
  if (document.body.classList.contains('opening-now')) return;
  document.body.classList.add('opening-now');
  setTimeout(() => location.href = opening.href, 720);
});
addEventListener('pageshow', () => document.body.classList.remove('opening-now'));
</script>
</body></html>
